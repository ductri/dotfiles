config_version: 2
settings:
  content.desktop_capture:
    https://oregonstateuniversity.sharepoint.com: true
    https://teams.microsoft.com: true
  content.geolocation:
    https://careers.adobe.com: true
    https://na2.docusign.net: true
  content.media.audio_capture:
    https://app.zoom.us: true
    https://meet.google.com: true
    https://teams.microsoft.com: true
  content.media.audio_video_capture:
    https://app.chime.aws: true
    https://oregonstateuniversity.sharepoint.com: true
    https://teams.microsoft.com: true
  content.media.video_capture:
    https://app.zoom.us: true
    https://meet.google.com: true
    https://teams.microsoft.com: true
  content.notifications.enabled:
    https://app.chime.aws: true
    https://colab.research.google.com: false
    https://messages.google.com: true
    https://vnexpress.net: false
    https://www.youtube.com: true
  content.register_protocol_handler:
    https://calendar.google.com?cid=%25s: false
    https://mail.google.com?extsrc=mailto&url=%25s: false
    https://outlook.office.com?mailtouri=%25s: false
    https://outlook.office365.com?mailtouri=%25s: false
  fonts.default_size:
    global: 16pt
  fonts.web.size.default:
    global: 20
  fonts.web.size.default_fixed:
    global: 13
